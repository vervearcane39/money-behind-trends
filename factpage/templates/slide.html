<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Head"; src: url("$font_head") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Body"; src: url("$font_body") format("truetype"); font-weight: 100 900; }
:root { --accent: $accent; --text: $text; --bg: $bg; --m: ${margin}px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
.slide { position: relative; width: 1080px; height: 1350px; color: var(--text); font-family: "Body", sans-serif; }
.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shade { position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8,10,12,.45) 0%, rgba(8,10,12,.35) 30%, rgba(8,10,12,.86) 60%, rgba(8,10,12,.97) 82%); }
.plain .shade { background: linear-gradient(160deg, rgba(255,255,255,.04), rgba(0,0,0,.25)); }
.label { position: absolute; top: var(--m); left: var(--m); display: flex; align-items: center; gap: 14px;
  font: 700 24px/1 "Body"; letter-spacing: .14em; text-transform: uppercase; }
.label .tag { background: var(--accent); color: #111; padding: 12px 16px; }
.label .topic { max-width: 640px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { position: absolute; top: calc(var(--m) + 10px); right: var(--m); font: 600 24px/1 "Body"; opacity: .7; }
.body { position: absolute; left: var(--m); right: var(--m); bottom: 200px; }
.headline { font-family: "Head"; font-weight: 800; font-stretch: 92%; font-size: 104px; line-height: .98;
  letter-spacing: -.02em; }
.kind-single .headline { font-size: 64px; margin-bottom: 40px; }
.rule { width: 96px; height: 8px; background: var(--accent); margin: 40px 0 36px; }
.number { font-family: "Head"; font-weight: 800; font-stretch: 88%; font-size: 168px; line-height: .95;
  color: var(--accent); letter-spacing: -.02em; white-space: nowrap; margin-bottom: 28px; }
.fact { font-weight: 500; font-size: 48px; line-height: 1.22; max-width: 920px; }
.footer { position: absolute; left: var(--m); right: var(--m); bottom: var(--m); display: flex;
  justify-content: space-between; align-items: flex-end; gap: 24px; font: 500 24px/1.3 "Body"; opacity: .78; }
.footer .src { max-width: 700px; }
</style></head>
<body>
<div class="slide kind-$kind $plain">
  $photo_tag
  <div class="shade"></div>
  <div class="label"><span class="tag">Trending</span><span class="topic">$topic</span></div>
  $count_tag
  <div class="body">
    $headline_tag
    $rule_tag
    $number_tag
    $fact_tag
  </div>
  <div class="footer"><div class="src">$sources</div><div class="handle">$handle</div></div>
</div>
<script>
  // Shrink any [data-fit] element until it fits its box (long numbers, long headlines).
  document.fonts.ready.then(() => {
    for (const el of document.querySelectorAll("[data-fit]")) {
      let size = parseFloat(getComputedStyle(el).fontSize);
      const maxH = parseFloat(el.dataset.fit);
      while ((el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > maxH) && size > 28) {
        size -= 2; el.style.fontSize = size + "px";
      }
    }
    document.body.dataset.ready = "1";
  });
</script>
</body></html>
