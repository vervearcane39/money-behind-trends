# ── Sources ─────────────────────────────────────────────────────────────────
# Only pages on these domains (or their subdomains) are ever read.
# Format: domain: Display name used in the image footer and caption.
sources:
  allow:
    # wire services
    reuters.com: Reuters
    apnews.com: AP
    afp.com: AFP
    ptinews.com: PTI
    # established news (India)
    thehindu.com: The Hindu
    thehindubusinessline.com: BusinessLine
    indianexpress.com: The Indian Express
    hindustantimes.com: Hindustan Times
    livemint.com: Mint
    economictimes.indiatimes.com: The Economic Times
    timesofindia.indiatimes.com: The Times of India
    business-standard.com: Business Standard
    moneycontrol.com: Moneycontrol
    ndtv.com: NDTV
    ndtvprofit.com: NDTV Profit
    financialexpress.com: Financial Express
    deccanherald.com: Deccan Herald
    espncricinfo.com: ESPNcricinfo
    # established news (international)
    bbc.com: BBC
    bbc.co.uk: BBC
    theguardian.com: The Guardian
    cnbc.com: CNBC
    cnn.com: CNN
    npr.org: NPR
    aljazeera.com: Al Jazeera
    variety.com: Variety
    hollywoodreporter.com: The Hollywood Reporter
    deadline.com: Deadline
    techcrunch.com: TechCrunch
    theverge.com: The Verge
    arstechnica.com: Ars Technica
    espn.com: ESPN
    the-numbers.com: The Numbers
    # reference (never enough on its own for a number)
    wikipedia.org: Wikipedia
    # regulators / official
    sec.gov: US SEC
    sebi.gov.in: SEBI
    rbi.org.in: RBI
    pib.gov.in: PIB
    bseindia.com: BSE
    nseindia.com: NSE
  # Any domain ending in one of these is treated as official government.
  allow_suffixes: [".gov", ".gov.in", ".nic.in", ".gov.uk", ".europa.eu"]
  # Never read, even if listed above by mistake.
  deny:
    - news.google.com
    - msn.com
    - yahoo.com
    - medium.com
    - substack.com
    - quora.com
    - reddit.com
    - facebook.com
    - instagram.com
    - x.com
    - twitter.com
    - youtube.com
    - tiktok.com
    - linkedin.com
    - pinterest.com
    - wikihow.com
    - thefactsite.com
    - factretriever.com
    - ranker.com
    - listverse.com
    - boredpanda.com
    - buzzfeed.com
    - forbes.com          # contributor network mixes unvetted posts with reporting
  # Paywalled — skipped. Matched against "host/path" prefixes.
  paywall:
    - nytimes.com
    - wsj.com
    - ft.com
    - bloomberg.com
    - economist.com
    - washingtonpost.com
    - barrons.com
    - theinformation.com
    - businessinsider.com
    - economictimes.indiatimes.com/prime
    - livemint.com/premium
    - the-ken.com

# ── AI ──────────────────────────────────────────────────────────────────────
# Any OpenAI-compatible provider works: change base_url/model/key_env.
# `extra` is passed straight to the provider. Groq notes (tested 2026-11-18):
# - hidden "reasoning" tokens count toward the answer budget; with default effort, gpt-oss ran out
#   mid-answer, so effort is set low and the budget explicit.
# - qwen3.8-27b has only 1,000 output tokens/minute on the free plan: the classifier runs with reasoning
#   off (labels only); the verifier keeps low reasoning and simply waits when limited.
llm:
  classifier: {base_url: "https://api.groq.com/openai/v1", model: "qwen/qwen3.8-27b", key_env: GROQ_API_KEY,
               extra: {reasoning_effort: none, max_completion_tokens: 2000}}
  angle:      {base_url: "https://api.groq.com/openai/v1", model: "openai/gpt-oss-120b", key_env: GROQ_API_KEY,
               extra: {include_reasoning: false, reasoning_effort: low, max_completion_tokens: 3000}}
  extractor:  {base_url: "https://api.groq.com/openai/v1", model: "openai/gpt-oss-120b", key_env: GROQ_API_KEY,
               extra: {include_reasoning: false, reasoning_effort: low, max_completion_tokens: 2500}}
  verifier:   {base_url: "https://api.groq.com/openai/v1", model: "qwen/qwen3.8-27b", key_env: GROQ_API_KEY,
               extra: {include_reasoning: false, reasoning_effort: low, max_completion_tokens: 1000}}
  max_retries: 6

# ── Images ──────────────────────────────────────────────────────────────────
images:
  avoid_faces: true
  # Photos whose tags/description mention these are rejected (logo risk).
  reject_tags: [logo, brand, sign, signage, billboard, advertisement, poster]
  commons_licences: ["public domain", "pd", "cc0", "cc by"]   # "cc by" = CC BY x.x only (no SA/NC/ND)

# ── Brand ───────────────────────────────────────────────────────────────────
brand:
  headline_font: Archivo
  body_font: Inter
  accent: "#FFB020"
  text: "#FFFFFF"
  background: "#111418"     # used when no licensed photo is found
  margin_px: 72
  headlines:                 # hook headline templates; {topic} is filled in; ≤8 words, no digits
    - "The money behind {topic}"
    - "{topic}, by the numbers"
    - "Behind the numbers"

# ── Writing rules (checked in code) ─────────────────────────────────────────
copy:
  max_headline_words: 8
  max_fact_words: 25
  max_facts: 3
  max_emoji: 1
  banned_phrases:
    - did you know
    - fun fact
    - mind-blowing
    - mind blowing
    - you won't believe
    - "🤯"
    - "!!"
    # hype words: state the figure plainly
    - whopping
    - chunky
    - staggering
    - massive
    - mind-boggling
    - jaw-dropping
    - eye-popping
  banned_time_words: [currently, now, today, this year, latest, recently, so far, right now, at present]
  # No predictions, forecasts or investment advice in any fact.
  banned_claim_words: [will, expected to, forecast, forecasts, projected, predicts, predicted, should,
                       buy, sell, target price, price target, invest, investors should, could, might]
  base_hashtags: ["#business", "#money"]
  max_hashtags: 5

# Contact info Wikimedia requires in the User-Agent.
user_agent: "MoneyBehindTrends/0.1 (https://github.com/vervearcane39)"

instagram:
  api_version: v27.0   # latest Graph API version per Meta changelog, checked 2026-11-18
