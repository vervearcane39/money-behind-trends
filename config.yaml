# ─────────────────────────────────────────────────────────────────────────────
#  Money Behind Trends — all settings live here. Edit on GitHub, commit, done.
# ─────────────────────────────────────────────────────────────────────────────

# KILL SWITCH. false = dry-run only (images + reports, nothing posted).
# Flip to true only after you have reviewed at least 20 dry-run posts.
publishing_enabled: false

# Your Instagram handle, shown in each image footer (e.g. "@moneybehindtrends").
# Live publishing refuses to run while this is empty.
handle: ""

# Posting slots (India time). Change these AND the cron lines in
# .github/workflows/post.yml together. Minute :07 avoids GitHub's busy top-of-hour.
timezone: Asia/Kolkata
slots: ["09:07", "13:07", "18:07", "21:07"]

# Where trends come from.
geos:
  IN: India
  US: the US
# How many of English Wikipedia's most-read articles (yesterday) to consider. 0 = off.
wikipedia_top: 25
# Business-section RSS feeds of established outlets. Each was checked against the
# outlet's robots.txt on 2026-11-18; re-check before adding new ones.
# Dropped: Business Standard (403 to bots), Google News (robots.txt forbids /rss), The Hindu Business and
# Deadline (articles marked subscriber-only, so skipped as paywalled), NDTV Profit (robots.txt disallows).
# limit = newest N headlines taken from each feed per run.
feeds:
  - {name: BBC Business, url: "https://feeds.bbci.co.uk/news/business/rss.xml", limit: 5}
  - {name: Moneycontrol Business, url: "https://www.moneycontrol.com/rss/business.xml", limit: 5}
  - {name: BusinessLine, url: "https://www.thehindubusinessline.com/feeder/default.rss", limit: 5}
  - {name: Mint Companies, url: "https://www.livemint.com/rss/companies", limit: 5}
  - {name: ET Industry, url: "https://economictimes.indiatimes.com/industry/rssfeeds/13352306.cms", limit: 5}
  - {name: CNBC Business, url: "https://www.cnbc.com/id/10001147/device/rss/rss.html", limit: 5}
  - {name: Guardian Business, url: "https://www.theguardian.com/uk/business/rss", limit: 5}
  - {name: Indian Express Business, url: "https://indianexpress.com/section/business/feed/", limit: 5}
  - {name: HT Business, url: "https://www.hindustantimes.com/feeds/rss/business/rssfeed.xml", limit: 5}
  - {name: Variety Biz, url: "https://variety.com/v/biz/feed/", limit: 5}
  - {name: Times of India Business, url: "https://timesofindia.indiatimes.com/rssfeeds/1898055.cms", limit: 5}
  - {name: TechCrunch, url: "https://techcrunch.com/feed/", limit: 5}
# At most this many candidates are sent to the AI per run (keeps within free-tier token limits).
max_candidates: 60

# If this many slots in a row are skipped (12 = 3 days), the run fails so GitHub emails you.
alert_after_skipped_runs: 12

# Second-source rule. false = one allowlisted NEWS site is enough for a fact (your decision, 2026-11-19).
# true = every fact also needs a second, different news site with the same figures.
# Either way, a fact taken only from Wikipedia is never enough on its own.
require_second_source: false

# How many days before a topic may be used again. Facts are never repeated.
topic_cooldown_days: 7
# Freshness: facts must be about this year or the previous N years (1 = 2025-2026 in 2026).
# A fact with no year needs a source article published in that window. Remove the line to turn off.
max_fact_age_years: 1

# A topic where no fact passed verification rests this long, so the next slot tries something else.
failed_topic_rest_hours: 24
# A topic needs at least this business-angle score (0-10) to be used.
min_angle_score: 6
# Used at most once per day when nothing trending has a clear money angle.
evergreen_topics:
  - Panama Canal
  - Suez Canal
  - Burj Khalifa
  - Indian Railways
  - Tata Group
  - The Lego Group
  - IKEA
  - Amul
  - Indian Premier League
  - FIFA World Cup
  - Rolex
  - Airbus A380
  - Concorde
  - Infosys
  - Maruti Suzuki
  - Netflix
  - Coca-Cola
  - Eiffel Tower

