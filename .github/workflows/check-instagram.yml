# Manual, read-only check that the Instagram connection works. Never posts anything.
# Run it from Actions -> check-instagram -> Run workflow.
name: check-instagram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests PyYAML
      - name: Check Instagram token, account and publishing permission
        run: python -m factpage check-instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
